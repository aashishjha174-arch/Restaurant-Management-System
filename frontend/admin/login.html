<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | The Secret Garden</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="margin: 0; padding: 0;">

  <div class="admin-login-wrapper">
    <div class="admin-login-card">
      <div style="text-align: center; margin-bottom: 20px;">
        <i class="fa-solid fa-seedling" style="font-size: 3rem; color: var(--secondary);"></i>
      </div>
      <h2>Garden Admin</h2>
      <p>Log in to manage bookings, menus, reviews and configurations</p>
      
      <form id="admin-login-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" required placeholder="admin">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-gold">Sign In</button>
      </form>
      
      <div style="text-align: center; margin-top: 25px; font-size: 0.8rem;">
        <a href="/" style="color: rgba(255,255,255,0.4); text-decoration: underline;"><i class="fa-solid fa-arrow-left"></i> Return to Homepage</a>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="/js/main.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
